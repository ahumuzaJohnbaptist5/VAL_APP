<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset password - VAL Cakes</title>
<script src="config.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#fafaf9;color:#292524;margin:0;display:grid;min-height:100vh;place-items:center}main{box-sizing:border-box;width:min(92%,440px);background:white;border:1px solid #e7e5e4;border-radius:18px;padding:28px}label{display:block;font-weight:bold;margin-top:16px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border-radius:8px;border:1px solid #a8a29e;font:inherit}button{background:#db2777;color:white;border:0;font-weight:bold;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}a{color:#be185d}#message{white-space:pre-wrap;margin-top:16px} [hidden]{display:none!important}
</style>
</head>
<body><main>
<a href="login.html">Back to login</a>
<h1 id="heading">Reset your password</h1>
<form id="requestForm">
<label for="phone">Registered phone number</label><input id="phone" type="tel" autocomplete="tel" required maxlength="20">
<label for="email">Registered email</label><input id="email" type="email" autocomplete="email" required>
<button>Send reset link</button></form>
<form id="confirmForm" hidden>
<label for="password">New password</label><input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<label for="repeat">Confirm password</label><input id="repeat" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
<button>Update password</button></form>
<p id="message" role="status" aria-live="polite"></p>
</main><script>
const params = new URLSearchParams(location.hash.slice(1));
const uid = params.get('uid'), token = params.get('token');
history.replaceState(null, '', location.pathname);
const requestForm = document.getElementById('requestForm'), confirmForm = document.getElementById('confirmForm');
const message = document.getElementById('message');
if(uid && token){requestForm.hidden=true;confirmForm.hidden=false;document.getElementById('heading').textContent='Choose a new password';}
async function submit(form, path, payload){
 const button = form.querySelector('button');button.disabled=true;message.textContent='Please wait...';
 try{
  const response=await fetch(USERS_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json();
  message.textContent=data.detail || Object.values(data).flat().join(' ');
  if(response.ok && form===confirmForm) form.hidden=true;
 }catch{message.textContent='Unable to connect. Please try again.';}
 finally{button.disabled=false;}
}
requestForm.addEventListener('submit',e=>{e.preventDefault();submit(requestForm,'password-reset/',{phone_number:document.getElementById('phone').value.trim(),email:document.getElementById('email').value.trim()});});
confirmForm.addEventListener('submit',e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('repeat').value){message.textContent='Passwords do not match.';return;}submit(confirmForm,'password-reset/confirm/',{uid,token,password});});
</script></body></html>

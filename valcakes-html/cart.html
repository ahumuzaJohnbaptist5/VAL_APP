<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Val Cakes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], }, colors: { brand: { pink: '#db2777', dark: '#1c1917', } } } }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-stone-50 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="Val Cakes Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'">
                <span class="font-serif text-xl font-bold text-gray-900 tracking-wide">VAL CAKES</span>
            </a>
            <a href="shopping.html" class="text-sm font-semibold text-gray-700 hover:text-brand-pink transition">Continue Shopping</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
        <h1 class="font-serif text-3xl font-bold text-gray-900 mb-8">Your Shopping Cart</h1>
        
        <div class="grid lg:grid-cols-3 gap-8">
            <!-- Cart Items Section -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
                <div id="cartItemsContainer" class="space-y-6">
                    <!-- Items will be injected here by JavaScript -->
                    <p class="text-gray-500 text-center py-10">Your cart is empty.</p>
                </div>
            </div>

            <!-- Order Summary Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6 h-fit sticky top-24">
                <h2 class="font-serif text-xl font-bold text-gray-900 mb-6">Order Summary</h2>
                
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal</span>
                        <span id="subtotalPrice">0 UGX</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Delivery Fee</span>
                        <span>5,000 UGX</span>
                    </div>
                    <div class="border-t border-stone-200 pt-4 flex justify-between font-bold text-lg text-gray-900">
                        <span>Total</span>
                        <span id="totalPrice">5,000 UGX</span>
                    </div>
                </div>

                <button onclick="proceedToCheckout()" class="w-full bg-brand-pink text-white font-bold py-3.5 rounded-lg hover:bg-pink-700 transition shadow-md text-base">
                    Proceed to Checkout
                </button>
                <p class="text-xs text-gray-500 text-center mt-4">Secure checkout powered by Val Cakes</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center text-gray-500 text-sm mt-auto">
        © 2026 Val Investments. All rights reserved.
    </footer>

    <!-- JAVASCRIPT FOR CART LOGIC -->
    <script>
        // 1. Load cart from localStorage
        let cart = JSON.parse(localStorage.getItem('valcakes_cart')) || [];
        const deliveryFee = 5000;

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-10">Your cart is empty. <a href="shopping.html" class="text-brand-pink font-semibold hover:underline">Go shopping!</a></p>';
                document.getElementById('subtotalPrice').innerText = '0 UGX';
                document.getElementById('totalPrice').innerText = deliveryFee.toLocaleString() + ' UGX';
                return;
            }

            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                html += `
                <div class="flex gap-4 border-b border-stone-100 pb-6 last:border-0 last:pb-0">
                    <img src="${item.image || 'https://via.placeholder.com/100'}" class="w-24 h-24 object-cover rounded-lg bg-stone-100">
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <h3 class="font-serif font-bold text-gray-900">${item.name}</h3>
                            <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 text-sm font-semibold">Remove</button>
                        </div>
                        <p class="text-sm text-gray-500 mb-2">${item.category_name || 'Item'}</p>
                        <div class="flex justify-between items-center mt-4">
                            <div class="flex items-center gap-3 bg-stone-100 rounded-lg p-1">
                                <button onclick="updateQuantity(${index}, -1)" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-700 font-bold hover:bg-stone-200">-</button>
                                <span class="font-semibold w-6 text-center">${item.quantity}</span>
                                <button onclick="updateQuantity(${index}, 1)" class="w-8 h-8 flex items-center justify-center bg-white rounded shadow-sm text-gray-700 font-bold hover:bg-stone-200">+</button>
                            </div>
                            <span class="font-bold text-brand-pink text-lg">${itemTotal.toLocaleString()} UGX</span>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
            document.getElementById('subtotalPrice').innerText = subtotal.toLocaleString() + ' UGX';
            document.getElementById('totalPrice').innerText = (subtotal + deliveryFee).toLocaleString() + ' UGX';
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1); // Remove if 0
            }
            saveCart();
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('valcakes_cart', JSON.stringify(cart));
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            // Check if logged in (as per your flowchart)
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                alert("Please login or create an account to checkout.");
                window.location.href = 'login.html';
            } else {
                window.location.href = 'checkout.html'; // We will build this next!
            }
        }

        // Run on load
        renderCart();

     const navContainer = document.querySelector('nav .flex.gap-4.items-center') || document.querySelector('nav .flex.items-center.gap-6');
    const user = JSON.parse(localStorage.getItem('user'));
    
    if (user && navContainer) {
        navContainer.innerHTML = `
            <a href="profile.html" class="text-sm font-semibold text-gray-700 hover:text-brand-pink transition">My Profile</a>
            <a href="cart.html" class="relative text-sm font-semibold text-gray-700 hover:text-brand-pink transition flex items-center gap-1">
                Cart
                <span id="cartBadge" class="bg-brand-pink text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </a>
        `;
        
        // Update cart badge
        const cart = JSON.parse(localStorage.getItem('valcakes_cart')) || [];
        if (cart.length > 0) {
            const badge = document.getElementById('cartBadge');
            badge.innerText = cart.length;
            badge.classList.remove('hidden');
        }
    }
    </script>
</body>
</html>

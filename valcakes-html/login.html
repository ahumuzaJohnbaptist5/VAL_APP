<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Val Cakes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], }, colors: { brand: { pink: '#db2777', dark: '#1c1917', } } } } }
    </script>
</head>
<body class="font-sans text-gray-800 bg-stone-50 min-h-screen flex flex-col">

    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
<img src="logo.png" alt="Val Cakes Logo" class="h-12 w-auto object-contain">                <span class="font-serif text-xl font-bold text-gray-900 tracking-wide">VAL CAKES</span>
            </a>
            <a href="index.html" class="text-sm font-semibold text-gray-700 hover:text-brand-pink transition">Home</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-stone-100">
            <div class="text-center mb-8">
                <h1 class="font-serif text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                <p class="text-gray-600">Log in to your Val Cakes account</p>
            </div>

            <div id="messageBox" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                    <input type="tel" id="phoneNumber" required class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-brand-pink outline-none bg-stone-50 text-gray-900" placeholder="077X XXX XXX">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:ring-2 focus:ring-brand-pink outline-none bg-stone-50 text-gray-900" placeholder="Enter your password">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-brand-pink text-white font-bold py-3.5 rounded-lg hover:bg-pink-700 transition shadow-md text-base">
                    Log In
                </button>
            </form>

            <p class="text-center text-gray-600 mt-8 text-sm">
                Don't have an account? <a href="register.html" class="text-brand-pink font-bold hover:underline">Register here</a>
            </p>
        </div>
    </main>

    <!-- JAVASCRIPT TO CONNECT TO DJANGO -->
   <script>
    const form = document.getElementById('loginForm');
    const messageBox = document.getElementById('messageBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.innerText = 'Logging in...';
        submitBtn.disabled = true;

        const data = {
            phone_number: document.getElementById('phoneNumber').value,
            password: document.getElementById('password').value
        };

        try {
            // FIXED: Proper fetch call with correct URL
            const response = await fetch('https://val-app.onrender.com/api/users/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                // 1. SAVE THE TOKEN!
                localStorage.setItem('access_token', result.tokens.access);
                localStorage.setItem('user', JSON.stringify(result.user));
                
                showMessage('Login successful! Redirecting...', 'success');
                
                // 2. REDIRECT BASED ON ROLE
                setTimeout(() => {
                    if (result.user.role === 'admin' || result.user.role === 'agent') {
                        window.location.href = 'owner-dashboard.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1500);
            } else {
                showMessage(result.detail || 'Invalid phone number or password.', 'error');
            }
        } catch (error) {
            console.error('Login error:', error);
            showMessage('Cannot connect to server. Please try again.', 'error');
        } finally {
            submitBtn.innerText = 'Log In';
            submitBtn.disabled = false;
        }
    });

    function showMessage(msg, type) {
        messageBox.innerText = msg;
        messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        if (type === 'error') messageBox.classList.add('bg-red-100', 'text-red-700');
        else messageBox.classList.add('bg-green-100', 'text-green-700');
    }
</script> 
</body>
</html>

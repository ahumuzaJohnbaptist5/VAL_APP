<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Val Cakes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'], }, colors: { brand: { pink: '#db2777', dark: '#1c1917', } } } }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-stone-50 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-stone-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" alt="Val Cakes Logo" class="h-12 w-auto object-contain" onerror="this.style.display='none'">
                <span class="font-serif text-xl font-bold text-gray-900 tracking-wide">VAL CAKES</span>
            </a>
            <div class="flex items-center gap-6">
                <a href="shopping.html" class="text-sm font-semibold text-gray-700 hover:text-brand-pink transition">Shop</a>
                <a href="cart.html" class="relative text-sm font-semibold text-gray-700 hover:text-brand-pink transition flex items-center gap-1">
                    Cart
                    <span id="cartBadge" class="bg-brand-pink text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="grid lg:grid-cols-4 gap-8">
            
            <!-- Sidebar Menu -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
                    <div class="text-center mb-6 pb-6 border-b border-stone-100">
                        <div class="w-20 h-20 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-pink font-serif font-bold text-3xl" id="userInitial">U</div>
                        <h2 class="font-serif font-bold text-gray-900" id="sidebarName">Customer</h2>
                        <p class="text-xs text-gray-500" id="sidebarRole">Customer Account</p>
                    </div>
                    <nav class="space-y-2">
                        <button onclick="switchTab('profile')" class="tab-btn w-full text-left px-4 py-3 rounded-lg font-semibold bg-pink-50 text-brand-pink transition">My Profile</button>
                        <button onclick="switchTab('orders')" class="tab-btn w-full text-left px-4 py-3 rounded-lg font-semibold text-gray-600 hover:bg-stone-50 transition">My Orders</button>
                        <a href="cart.html" class="block w-full text-left px-4 py-3 rounded-lg font-semibold text-gray-600 hover:bg-stone-50 transition">My Cart</a>
                        <button onclick="logout()" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-red-600 hover:bg-red-50 transition mt-4 border-t border-stone-100 pt-4">Log Out</button>
                    </nav>
                </div>
            </div>

            <!-- Content Area -->
            <div class="lg:col-span-3">
                
                <!-- Profile Tab -->
                <div id="profileTab" class="bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
                    <h1 class="font-serif text-2xl font-bold text-gray-900 mb-6">Profile Details</h1>
                    <form id="profileForm" class="space-y-5 max-w-lg">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                            <input type="text" id="profileName" class="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-brand-pink outline-none bg-stone-50">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Phone Number</label>
                            <input type="tel" id="profilePhone" class="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-brand-pink outline-none bg-stone-50">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                            <input type="email" id="profileEmail" class="w-full p-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-brand-pink outline-none bg-stone-50">
                        </div>
                        <button type="submit" class="bg-brand-pink text-white font-bold px-6 py-3 rounded-lg hover:bg-pink-700 transition shadow-md">
                            Save Changes
                        </button>
                    </form>
                </div>

                <!-- Orders Tab (Hidden by default) -->
                <div id="ordersTab" class="hidden bg-white rounded-2xl shadow-sm border border-stone-200 p-8">
                    <h1 class="font-serif text-2xl font-bold text-gray-900 mb-6">My Orders</h1>
                    <div id="ordersList" class="space-y-4">
                        <!-- Orders will be injected here -->
                        <p class="text-gray-500 text-center py-10">You haven't placed any orders yet.</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8 text-center text-gray-500 text-sm mt-auto">
        © 2026 Val Investments. All rights reserved.
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        // 1. Security Check
        const user = JSON.parse(localStorage.getItem('user'));
        const token = localStorage.getItem('access_token');
        
        if (!user || !token) {
            window.location.href = 'login.html';
        }

        // 2. Load User Data
        document.getElementById('sidebarName').innerText = user.full_name;
        document.getElementById('sidebarRole').innerText = user.role === 'admin' ? 'Admin Account' : 'Customer Account';
        document.getElementById('userInitial').innerText = user.full_name.charAt(0).toUpperCase();
        
        document.getElementById('profileName').value = user.full_name;
        document.getElementById('profilePhone').value = user.phone_number;
        document.getElementById('profileEmail').value = user.email || '';

        // 3. Update Cart Badge
        const cart = JSON.parse(localStorage.getItem('valcakes_cart')) || [];
        if (cart.length > 0) {
            const badge = document.getElementById('cartBadge');
            badge.innerText = cart.length;
            badge.classList.remove('hidden');
        }

        // 4. Tab Switching
        function switchTab(tabName) {
            document.getElementById('profileTab').classList.add('hidden');
            document.getElementById('ordersTab').classList.add('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-pink-50', 'text-brand-pink');
                btn.classList.add('text-gray-600', 'hover:bg-stone-50');
            });

            if (tabName === 'profile') {
                document.getElementById('profileTab').classList.remove('hidden');
                event.target.classList.add('bg-pink-50', 'text-brand-pink');
                event.target.classList.remove('text-gray-600', 'hover:bg-stone-50');
            } else if (tabName === 'orders') {
                document.getElementById('ordersTab').classList.remove('hidden');
                event.target.classList.add('bg-pink-50', 'text-brand-pink');
                event.target.classList.remove('text-gray-600', 'hover:bg-stone-50');
                renderOrders();
            }
        }

        // 5. Save Profile
        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const updatedUser = {
                ...user,
                full_name: document.getElementById('profileName').value,
                phone_number: document.getElementById('profilePhone').value,
                email: document.getElementById('profileEmail').value
            };
            localStorage.setItem('user', JSON.stringify(updatedUser));
            alert('Profile updated successfully!');
            location.reload();
        });

        // 6. Render Mock Orders (For demonstration)
        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem('valcakes_orders')) || [];
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-10">You haven\'t placed any orders yet. <a href="shopping.html" class="text-brand-pink font-semibold hover:underline">Start shopping!</a></p>';
                return;
            }

            let html = '';
            orders.forEach(order => {
                html += `
                <div class="border border-stone-200 rounded-xl p-4 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-gray-900">Order #${order.id}</p>
                        <p class="text-sm text-gray-500">${order.date} • ${order.items} items</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-brand-pink">${order.total} UGX</p>
                        <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-semibold">${order.status}</span>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
